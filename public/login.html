<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>myGrowatt - Logowanie</title>
<link rel="stylesheet" href="css/style.css">
<style>
body {
  margin: 0;
  padding: 0;
  min-height: 100vh;
  background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #0f0f1a 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
.login-container {
  width: 100%;
  max-width: 420px;
  padding: 20px;
}
.login-card {
  background: #1e1e32;
  border: 1px solid #2a2a45;
  border-radius: 16px;
  padding: 40px 32px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}
.login-logo {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-bottom: 8px;
}
.login-logo svg {
  width: 40px;
  height: 40px;
}
.login-logo h1 {
  font-size: 24px;
  font-weight: 700;
  color: #e0e0e0;
  margin: 0;
}
.login-subtitle {
  text-align: center;
  color: #888;
  font-size: 13px;
  margin-bottom: 28px;
}
.form-group {
  margin-bottom: 18px;
}
.form-group label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: #aaa;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
}
.form-group input {
  width: 100%;
  padding: 12px 14px;
  background: #16162a;
  border: 1px solid #2a2a45;
  border-radius: 10px;
  color: #e0e0e0;
  font-size: 15px;
  outline: none;
  transition: border 0.2s;
  box-sizing: border-box;
}
.form-group input:focus {
  border-color: #f5c842;
}
.form-group input::placeholder {
  color: #555;
}
.login-btn {
  width: 100%;
  padding: 12px;
  background: #f5c842;
  color: #0f0f1a;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.2s, transform 0.1s;
}
.login-btn:hover {
  background: #e6b52e;
}
.login-btn:active {
  transform: scale(0.98);
}
.login-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
.login-error {
  background: rgba(255, 80, 80, 0.12);
  border: 1px solid rgba(255, 80, 80, 0.3);
  border-radius: 8px;
  padding: 10px 14px;
  color: #ff6b6b;
  font-size: 13px;
  margin-bottom: 16px;
  display: none;
}
.login-error.show {
  display: block;
}
.login-info {
  text-align: center;
  color: #666;
  font-size: 12px;
  margin-top: 20px;
}
.api-key-note {
  text-align: center;
  color: #555;
  font-size: 11px;
  margin: -12px 0 16px;
  line-height: 1.4;
}
</style>
</head>
<body>
<div class="login-container">
  <div class="login-card">
    <div class="login-logo">
      <svg viewBox="0 0 48 48" fill="none">
        <circle cx="24" cy="24" r="22" stroke="#f5c842" stroke-width="2"/>
        <path d="M24 6L36 30H12L24 6Z" fill="#f5c842" opacity="0.8"/>
        <path d="M20 30h8v10h-8z" fill="#f5c842" opacity="0.6"/>
      </svg>
      <h1>myGrowatt</h1>
    </div>
    <p class="login-subtitle">Monitorowanie PV</p>

    <div id="login-error" class="login-error"></div>

    <form id="login-form" autocomplete="on">
      <div class="form-group">
        <label for="email-input">Adres e-mail (Growatt)</label>
        <input type="email" id="email-input" placeholder="twoj@email.pl" autocomplete="email" autofocus required>
      </div>

      <div class="form-group">
        <label for="password-input">Hasło (Growatt)</label>
        <input type="password" id="password-input" placeholder="Hasło do server.growatt.com" autocomplete="current-password" required>
      </div>

      <div class="form-group">
        <label for="api-key-input">Klucz API Growatt <span style="color:#666;font-weight:400">(opcjonalnie)</span></label>
        <input type="text" id="api-key-input" placeholder="Token OpenAPI — tylko dla zaawansowanych" autocomplete="off">
      </div>
      <p class="api-key-note">Klucz API jest opcjonalny. Bez niego większość funkcji działa przez standardowe logowanie.</p>

      <button type="submit" class="login-btn" id="login-btn">Zaloguj się</button>
      <p class="login-info">Logowanie przez server.growatt.com</p>
    </form>
  </div>
</div>

<script>
const emailInput = document.getElementById('email-input');
const passwordInput = document.getElementById('password-input');
const apiKeyInput = document.getElementById('api-key-input');
const loginBtn = document.getElementById('login-btn');
const loginError = document.getElementById('login-error');
const loginForm = document.getElementById('login-form');

function showError(msg) {
  loginError.textContent = msg;
  loginError.classList.add('show');
}
function hideError() {
  loginError.textContent = '';
  loginError.classList.remove('show');
}

// Already logged in?  Redirect straight away.
(async () => {
  try {
    const r = await fetch('/api/auth/status');
    const d = await r.json();
    if (d.loggedIn) window.location.href = '/';
  } catch {}
})();

loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  hideError();

  const email = emailInput.value.trim();
  const password = passwordInput.value;
  const apiKey = apiKeyInput.value.trim() || undefined;

  if (!email) { showError('Wpisz adres e-mail'); return; }
  if (!password) { showError('Wpisz hasło'); return; }

  loginBtn.disabled = true;
  loginBtn.textContent = 'Logowanie...';

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password, apiKey }),
    });
    const data = await res.json();

    if (data.success) {
      window.location.href = '/';
    } else {
      showError(data.error || 'Nieprawidłowe dane logowania');
    }
  } catch (err) {
    showError('Błąd połączenia z serwerem');
  } finally {
    loginBtn.disabled = false;
    loginBtn.textContent = 'Zaloguj się';
  }
});
</script>
</body>
</html>
