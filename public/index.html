<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>myGrowatt - PV Plant Monitor</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
<div id="app">
  <div id="dashboard-screen" class="screen active">
    <header class="topbar">
      <div class="topbar-left">
        <div class="logo-small">
          <svg viewBox="0 0 48 48" fill="none" width="28" height="28"><circle cx="24" cy="24" r="22" stroke="#f5c842" stroke-width="2"/><path d="M24 6L36 30H12L24 6Z" fill="#f5c842" opacity="0.8"/><path d="M20 30h8v10h-8z" fill="#f5c842" opacity="0.6"/></svg>
        </div>
        <h2>myGrowatt</h2>
          <span id="account-name" class="account-name"></span>
      </div>
      <div class="topbar-right">
        <button id="refresh-btn" title="Refresh all data">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M17.65 6.35A7.96 7.96 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" fill="currentColor"/></svg>
          Refresh
        </button>
      </div>
    </header>

    <main id="main-content">
      <section id="plants-overview">
        <div class="section-header">
          <h2 id="plants-count">Your Plants</h2>
          <div class="summary-stats" id="summary-stats"></div>
        </div>
        <div id="plant-cards" class="plant-cards"></div>
      </section>

      <section id="plant-detail" class="hidden">
        <button id="back-btn" class="back-btn">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" fill="currentColor"/></svg>
          All Plants
        </button>
        <div id="plant-detail-header"></div>

        <div class="tabs">
          <button class="tab active" data-tab="overview">Overview</button>
          <button class="tab" data-tab="devices">Devices</button>
          <button class="tab" data-tab="charts">Energy Charts</button>
          <button class="tab" data-tab="battery">Battery</button>
        </div>

        <div id="tab-overview" class="tab-content active"></div>
        <div id="tab-charts" class="tab-content">
          <div class="chart-controls">
            <div class="btn-group" id="chart-period">
              <button class="btn-sm active" data-period="daily">Day</button>
              <button class="btn-sm" data-period="monthly">Month</button>
              <button class="btn-sm" data-period="yearly">Year</button>
            </div>
          </div>
          <div class="chart-grid">
            <div class="chart-card"><canvas id="chart-energy"></canvas></div>
            <div class="chart-card"><canvas id="chart-power"></canvas></div>
          </div>
        </div>
        <div id="tab-battery" class="tab-content"></div>
        <div id="tab-devices" class="tab-content">
          <div id="devices-grid" class="devices-grid"></div>
        </div>
      </section>
    </main>
  </div>

  <div id="loading" class="loading-overlay hidden">
    <div class="spinner"></div>
    <p id="loading-text">Loading...</p>
  </div>
  <div id="toast-container" class="toast-container"></div>
</div>
  <script src="js/app.js"></script>

  <!-- Device Settings Modal -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-overlay" onclick="closeSettings()"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="settings-title">Device Settings</h3>
        <button class="modal-close" onclick="closeSettings()">&times;</button>
      </div>
      <div class="modal-body" id="settings-body">
        <div id="settings-loading" class="modal-loading">Loading settings...</div>
        <form id="settings-form" class="hidden">
          <div id="settings-fields"></div>
          <div class="settings-actions">
            <button type="button" class="btn-sm" onclick="closeSettings()">Cancel</button>
            <button type="submit" class="btn-sm btn-primary" id="save-settings-btn">Save Settings</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
